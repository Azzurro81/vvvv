<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoStranieri - iPhone Preview</title>
    <style>
        :root {
            --phone-width: 390px;
            --phone-height: 844px;
            --bezel-size: 12px;
            --frame-color: #1a1a1a;
            --screen-radius: 32px;
            --frame-radius: 44px;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            flex-direction: column;
            overflow-x: hidden;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            color: #0f4c81;
            margin: 0;
            font-weight: 800;
        }

        .header p {
            font-size: 14px;
            color: #64748b;
            margin-top: 5px;
        }

        /* The main phone container */
        .phone-mockup {
            position: relative;
            width: var(--phone-width);
            height: var(--phone-height);
            background: var(--frame-color);
            border-radius: var(--frame-radius);
            box-shadow: 
                0 0 0 2px #444,
                0 0 20px 5px rgba(0,0,0,0.1),
                0 50px 100px -20px rgba(0,0,0,0.3);
            border: 4px solid #333;
            box-sizing: content-box;
        }

        /* The buttons on the side */
        .button {
            position: absolute;
            background: #1a1a1a;
            border-radius: 2px;
        }

        .button-silent {
            width: 3px;
            height: 30px;
            top: 100px;
            left: -7px;
        }

        .button-vol-up {
            width: 3px;
            height: 60px;
            top: 160px;
            left: -7px;
        }

        .button-vol-down {
            width: 3px;
            height: 60px;
            top: 235px;
            left: -7px;
        }

        .button-power {
            width: 3px;
            height: 90px;
            top: 180px;
            right: -7px;
        }

        /* The Screen */
        .screen-container {
            position: absolute;
            top: var(--bezel-size);
            left: var(--bezel-size);
            right: var(--bezel-size);
            bottom: var(--bezel-size);
            background: #fff;
            border-radius: var(--screen-radius);
            overflow: hidden;
            z-index: 10;
        }

        /* Dynamic Island / Notch */
        .dynamic-island {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background: #000;
            border-radius: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
        }

        .camera-dot {
            width: 6px;
            height: 6px;
            background: #1a1a2e;
            border-radius: 50%;
            box-shadow: 0 0 2px rgba(255,255,255,0.2) inset;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Glossy reflection */
        .gloss {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 50%);
        }

        @media (max-height: 950px) {
            .phone-mockup {
                transform: scale(0.85);
                margin-top: -50px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>InfoStranieri 2026</h1>
        <p>Anteprima Mobile Istituzionale</p>
    </div>

    <div class="phone-mockup">
        <div class="button button-silent"></div>
        <div class="button button-vol-up"></div>
        <div class="button button-vol-down"></div>
        <div class="button button-power"></div>
        
        <div class="dynamic-island">
            <div class="camera-dot"></div>
        </div>

        <div class="screen-container">
            <div class="gloss"></div>
            <iframe src="http://localhost:8081" title="App InfoStranieri"></iframe>
        </div>
    </div>
</body>
</html>
